apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-worker-deployment
spec:
  # No public Service/Ingress targets this Deployment (see the ClusterIP
  # service — internal only, no ingress route). It consumes the
  # `video-transcode` BullMQ queue and talks to Postgres/GCS; nothing calls it
  # over HTTP except same-pod health/readiness probes.
  selector:
    matchLabels:
      component: asset-worker
  template:
    metadata:
      labels:
        component: asset-worker
    spec:
      # Let an in-flight ffmpeg/sharp job finish releasing its BullMQ lock on
      # SIGTERM (see main.ts's enableShutdownHooks()) before the pod is killed.
      terminationGracePeriodSeconds: 60
      containers:
        - name: asset-worker-container
          image: mo29172/lghorba_asset_worker:latest
          ports:
            - containerPort: 4000
          resources:
            # Deliberately the tightest budget of the three app deployments.
            # ffmpeg/sharp jobs are background work with no user waiting on
            # a response — they must never contend with back/front for CPU.
            #
            # The REQUEST (not just the limit) is what matters here: K8s
            # arbitrates CPU under node contention by request-based cgroup
            # weight, not by limit. A request as low as back/front's (200m)
            # gave this pod an equal claim to CPU during contention and was
            # enough, in practice on this exact VPS, to starve the control
            # plane (etcd/apiserver) when ffmpeg ran. A tiny request (50m)
            # means the scheduler deprioritizes this pod the instant anything
            # else wants the CPU it's using — it only gets to run at full
            # speed when the node has spare cycles. The limit (300m) is the
            # hard ceiling even when the node is otherwise idle.
            limits:
              cpu: 300m
              memory: 1Gi
              # HLS transcode writes several renditions + segments to /tmp
              # simultaneously (up to ~2-4x source size); bound it so a large
              # video can't fill the node's disk and starve db/redis/other pods.
              ephemeral-storage: 4Gi
            requests:
              cpu: 50m
              memory: 384Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: TZ
              value: UTC
            # ── Configurable processing limits (plain values, not secret —
            # tune per deployment without touching CI/secrets) ──────────────
            # BullMQ concurrency: jobs processed in parallel BY THIS POD. Kept
            # at 1 given the tight CPU budget above — raising this multiplies
            # simultaneous ffmpeg/sharp processes competing for the same
            # 300m limit, which directly fights "the worker must be limited".
            - name: WORKER_CONCURRENCY
              value: "1"
            # ffmpeg's own internal encoder threads, independent of the pod's
            # cgroup CPU limit — keeps a single job from requesting more
            # threads than this pod can usefully schedule.
            - name: FFMPEG_THREADS
              value: "1"
            # nice(1) value applied to every spawned ffmpeg process (0-19,
            # higher = lower OS scheduling priority) so encodes always yield
            # to this pod's own health/metrics HTTP handling.
            - name: FFMPEG_NICENESS
              value: "10"
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: NODE_ENV 
            - name: BACK_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: BACK_PORT 
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: APP_URL 
            - name: TYPEORM_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_HOST
            - name: TYPEORM_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PORT
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_USERNAME
            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PASSWORD 
            - name: TYPEORM_DATABASE
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_DATABASE
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_BUCKET_NAME
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PROJECT_ID
            - name: GCS_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_CLIENT_EMAIL
            - name: GCS_PRIVATE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY_ID
            - name: GCS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_DB

