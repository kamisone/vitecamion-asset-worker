apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-worker-deployment
spec:
  selector:
    matchLabels:
      component: asset-worker
  template:
    metadata:
      labels:
        component: asset-worker
    spec:
      containers:
        - name: asset-worker-container
          image: mo29172/lghorba_asset_worker:latest
          ports:
            - containerPort: 4000
          resources:
            limits:
              cpu: 500m
            requests:
              cpu: 200m
          env:
            - name: TZ
              value: UTC
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: NODE_ENV 
            - name: BACK_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: BACK_PORT 
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: APP_URL 
            - name: TYPEORM_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_HOST
            - name: TYPEORM_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PORT
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_USERNAME
            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PASSWORD 
            - name: TYPEORM_DATABASE
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_DATABASE
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_BUCKET_NAME
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PROJECT_ID
            - name: GCS_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_CLIENT_EMAIL
            - name: GCS_PRIVATE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY_ID
            - name: GCS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_DB
           
            
