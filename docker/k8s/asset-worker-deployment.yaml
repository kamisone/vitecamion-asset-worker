apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-worker-deployment
spec:
  # No public Service/Ingress targets this Deployment (see the ClusterIP
  # service — internal only, no ingress route). It consumes the
  # `video-transcode` BullMQ queue and talks to Postgres/GCS; nothing calls it
  # over HTTP except same-pod health/readiness probes.
  selector:
    matchLabels:
      component: asset-worker
  template:
    metadata:
      labels:
        component: asset-worker
    spec:
      # Let an in-flight ffmpeg/sharp job finish releasing its BullMQ lock on
      # SIGTERM (see main.ts's enableShutdownHooks()) before the pod is killed.
      terminationGracePeriodSeconds: 60
      containers:
        - name: asset-worker-container
          image: mo29172/lghorba_asset_worker:latest
          ports:
            - containerPort: 4000
          resources:
            # Memory limits matter as much as CPU: an unbounded encoder pod
            # can destabilize the node the same way an unbounded API pod can.
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: TZ
              value: UTC
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: NODE_ENV 
            - name: BACK_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: BACK_PORT 
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: APP_URL 
            - name: TYPEORM_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_HOST
            - name: TYPEORM_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PORT
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_USERNAME
            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_PASSWORD 
            - name: TYPEORM_DATABASE
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: TYPEORM_DATABASE
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_BUCKET_NAME
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PROJECT_ID
            - name: GCS_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_CLIENT_EMAIL
            - name: GCS_PRIVATE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY_ID
            - name: GCS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: GCS_PRIVATE_KEY
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: asset-worker-envs
                  key: REDIS_DB

